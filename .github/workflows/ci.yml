name: CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore & Build .NET API
        run: |
          dotnet restore EnterpriseDashboard.Api/EnterpriseDashboard.Api.csproj
          dotnet build EnterpriseDashboard.Api/EnterpriseDashboard.Api.csproj

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Typecheck & Build SvelteKit
        run: |
          cd frontend
          npm ci
          npm run check

      - name: Validate Docker Compose Build
        run: docker compose build
